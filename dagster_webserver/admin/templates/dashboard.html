{% extends "base.html" %}
{% block title %}Dagster Admin — Dashboard{% endblock %}
{% block content %}
<h1 class="page-title">Dashboard</h1>

<div class="dash-grid">
  {% for view in views %}
  <a class="dash-card" href="/admin/{{ view.identity }}/list">
    <div class="dash-icon">{{ icon(view.icon, 24) }}</div>
    <div class="dash-label">{{ view.plural_label }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
